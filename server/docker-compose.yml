# Arenna Remote server: OSS rustdesk-server (hbbs = ID/rendezvous, hbbr = relay).
#
# Deployed at rustdesk.arenna38.com in /opt/rustdesk-server. The data folder
# holds the server key pair (id_ed25519 / id_ed25519.pub) and the peer
# database; the public key is compiled into the clients
# (libs/hbb_common/src/arenna.rs, SERVER_PUBLIC_KEY), so losing or changing
# id_ed25519 breaks every installed client. Back it up (see backup.sh).
#
# `-k _` makes both hbbs and hbbr refuse clients that do not know the key.
# Host networking lets the servers see real client IPs (needed for NAT
# traversal).
services:
  hbbs:
    container_name: hbbs
    image: rustdesk/rustdesk-server:1.1.16
    command: hbbs -r rustdesk.arenna38.com:21117 -k _
    volumes:
      - ./data:/root
    network_mode: host
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    container_name: hbbr
    image: rustdesk/rustdesk-server:1.1.16
    command: hbbr -k _
    volumes:
      - ./data:/root
    network_mode: host
    restart: unless-stopped
